[package]
name = "graydr-registry"
version = "1.2.0"
edition = "2021"
description = "Self-hostable module registry server for graydr"
license = "AGPL-3.0-only"
repository = "https://github.com/momidala/graydr"
homepage = "https://github.com/momidala/graydr"
keywords = ["infrastructure", "iac", "registry", "modules"]
categories = ["command-line-utilities", "web-programming::http-server"]

[[bin]]
name = "graydr-registry"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
semver = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["multipart", "json", "rustls-tls"], default-features = false }
serde_json = "1"
