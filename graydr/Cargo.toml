[package]
name = "graydr"
version = "1.0.0"
edition = "2021"
description = "Multi-cloud IaC compiler — write once, compile to CloudFormation, Bicep, or Terraform"
license = "AGPL-3.0-only"
repository = "https://github.com/momidala/graydr"
homepage = "https://github.com/momidala/graydr"
documentation = "https://github.com/momidala/graydr/tree/main/docs"
readme = "../README.md"
keywords = ["infrastructure", "iac", "terraform", "cloudformation", "bicep"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "graydr"
path = "src/main.rs"

[lib]
name = "graydr"
path = "src/lib.rs"

[dependencies]
hcl-rs = "0.19"
hcl-edit = "0.8"
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
semver = "1.0"
petgraph = "0.8"
tera = "1.20"
clap = { version = "4.5", features = ["derive", "cargo"] }
regex = "1.11"
evalexpr = "11"
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "multipart", "json", "rustls-tls"], default-features = false }
dirs = "6.0"
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.10"
mockito = "1"
